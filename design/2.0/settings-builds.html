<html lang="en">
<head>

<title>App Manager: settings: which builds</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
<span class="brand">Sunshine</span><span class="sep">/</span><span class="where">App Manager</span>
<span class="ver">2.0.0</span>
<a class="gear" href="settings.html"><span class="glyph wide">☰</span>Settings</a>
</header>
<main class="main">
<div class="head"><h1>Settings</h1><span class="sub">None of this touches your app list.</span></div>
<div class="panes">
<nav class="nav" aria-label="Settings">
<a href="settings.html">Appearance</a>
<a href="settings-language.html">Language</a>
<a href="settings-art.html">Community artwork</a>
<a href="settings-sunshine.html">Which Sunshine</a>
<a href="settings-defaults.html">Default tiles</a>
<a href="settings-updates.html">Updates</a>
<a href="settings-builds.html" class="here">Which builds</a>
</nav>
<div class="pane">
<h2>Which builds</h2>
<form method="post" action="/settings/channel"><input type="hidden" name="setting" value="dev_builds">
<button class="switch" type="submit" name="value" value="1" role="switch" aria-checked="false" autofocus><span class="knob"></span><span class="t"><b>Offer development builds</b><span>Newer, and sometimes broken. Off means only finished releases.</span></span></button></form>
<form method="post" action="/settings/channel"><input type="hidden" name="setting" value="stable_if_no_newer_dev">
<button class="switch on flat" type="submit" name="value" value="0" role="switch" aria-checked="true" disabled><span class="knob"></span><span class="t"><b>Move to the finished release when it is newer</b><span>A release is where a development build was heading, so this leaves you on the finished one rather than stranded on an older preview. Only applies while development builds are on.</span></span></button></form>
</div>
</div>
</main>
<footer class="bar">
<a class="btn sec" href="grid.html" data-back><span class="glyph b">B</span>Back to the apps</a>
<span class="grow"></span>
</footer>

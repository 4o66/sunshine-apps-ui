[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# The version is the package's, so there is one answer rather than two that
# drift: a development build is <release>.dev<commit count>, and the count
# comes from git in a checkout and from a file the installer bakes otherwise.
[tool.setuptools.dynamic]
version = {attr = "sunshine_apps_ui.__version__"}

[project]
name = "sunshine-apps-ui"
dynamic = ["version"]
description = "Manage the applications Sunshine offers: a tile manager for apps.json, reached through Moonlight or at the console. Keeps the edits you make by hand, remembers what you deleted, and binds 127.0.0.1 only."
readme = "README.md"
license = { file = "LICENSE" }
# GPL-3.0-or-later: the FSF's own recommendation, and strictly the more useful
# of the two -- code offered "or later" can still be used as plain v3 by a
# project that pins v3, while the reverse is not true.
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
requires-python = ">=3.9"
# Intentionally zero runtime dependencies: stdlib http.server only.
# Target systems are immutable (Bazzite rpm-ostree, SteamOS), where
# installing packages at runtime is a foot-gun. See docs/security.md.
dependencies = []

[project.scripts]
sunshine-apps-ui = "sunshine_apps_ui.__main__:main"

[project.urls]
Homepage = "https://github.com/4o66/sunshine-apps-ui"
Companion = "https://github.com/4o66/bazzite-sunshine-manager"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The dirty-guard script is served at runtime; the C# window is compiled at
# install time from the source shipped here, so both have to be installed.
"sunshine_apps_ui" = ["assets/*", "host/*.cs"]
